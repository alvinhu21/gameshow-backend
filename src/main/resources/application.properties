spring.application.name=gameShows

# Database configuration
spring.datasource.j.jdbc-url=jdbc:sqlite:jeopardy.db
spring.datasource.j.driver-class-name=org.sqlite.JDBC
spring.datasource.wof.jdbc-url=jdbc:sqlite:wheelOfFortune.db
spring.datasource.wof.driver-class-name=org.sqlite.JDBC

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized
management.endpoint.health.probes.enabled=true

# Logging
logging.level.root=INFO
logging.level.com.gameShows=INFO

# Error handling
server.error.include-stacktrace=never