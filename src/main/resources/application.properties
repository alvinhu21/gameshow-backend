spring.application.name=gameShows
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
# Database connection settings for WoF
spring.datasource.wof.jdbc-url=jdbc:sqlite:wheelOfFortune.db
spring.datasource.wof.driver-class-name=org.sqlite.JDBC

# Database connection settings for J
spring.datasource.j.jdbc-url=jdbc:sqlite:jeopardy.db
spring.datasource.j.driver-class-name=org.sqlite.JDBC

# Hibernate Dialect (SQLite isn't officially supported, so we use a generic one or a community dialect)
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect

# Hibernate settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true